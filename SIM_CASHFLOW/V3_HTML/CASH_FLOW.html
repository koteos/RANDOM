<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Flujo de Efectivo</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
  <style>

  </style>
</head>
<body>
  <div class="container">
    <h1>Simulador de Flujo de Efectivo</h1>

    <!-- Secciones anteriores no modificadas -->

    <h2>Flujo de Caja</h2>
    <table id="flujoCajaTable">
      <thead>
        <tr>
          <th>Mes</th>
          <th>Fecha(s) de Ingreso</th>
          <th>Ingresos</th>
          <th>Egresos</th>
          <th>Flujo Neto</th>
          <th>Flujo Acumulado</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <canvas id="graficoFlujo"></canvas>
  </div>

  <script>
    const meses = Array.from({ length: 12 }, (_, i) => {
      const mes = (i + 1).toString().padStart(2, '0');
      return `2025-${mes}`;
    });

    function calcularFlujoDeCaja() {
      const resumen = {};
      meses.forEach(m => resumen[m] = { ingresos: 0, fechas: [], egresos: gastoFijo });

      facturas.forEach(factura => {
        const fechaPago = new Date(new Date(factura.fecha).getTime() + factura.diasPago * 86400000);
        const mesPago = fechaPago.toISOString().slice(0, 7);
        const fechaTexto = fechaPago.toISOString().slice(0, 10);
        if (resumen[mesPago]) {
          resumen[mesPago].ingresos += factura.monto;
          resumen[mesPago].fechas.push(fechaTexto);
        }
      });

      const ingresos = [], egresos = [], flujoNeto = [], flujoAcumulado = [], fechasIngreso = [];
      let acumulado = 0;

      meses.forEach(m => {
        const ingreso = resumen[m].ingresos;
        const egreso = resumen[m].egresos;
        const neto = ingreso - egreso;
        acumulado += neto;

        ingresos.push(ingreso);
        egresos.push(egreso);
        flujoNeto.push(neto);
        flujoAcumulado.push(acumulado);
        fechasIngreso.push(resumen[m].fechas.join('<br>'));
      });

      return { ingresos, egresos, flujoNeto, flujoAcumulado, fechasIngreso };
    }

    function renderFlujoCajaTable() {
      const { ingresos, egresos, flujoNeto, flujoAcumulado, fechasIngreso } = calcularFlujoDeCaja();
      flujoCajaTable.innerHTML = '';
      meses.forEach((mes, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${mes}</td>
          <td>${fechasIngreso[index]}</td>
          <td>${ingresos[index]}</td>
          <td>${egresos[index]}</td>
          <td>${flujoNeto[index]}</td>
          <td>${flujoAcumulado[index]}</td>
        `;
        flujoCajaTable.appendChild(row);
      });
      renderGraficoFlujo(meses, ingresos, egresos, flujoAcumulado);
    }
  </script>
</body>
</html>
