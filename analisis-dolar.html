<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Precios del Dólar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div id="app"></div>

    <script>
        const state = {
            data: null,
            loading: false,
            error: null,
            fileSelected: false
        };

        function render() {
            const app = document.getElementById('app');
            
            if (state.loading) {
                app.innerHTML = `
                    <div class="p-8 max-w-4xl mx-auto">
                        <div class="flex items-center justify-center">
                            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                            <span class="ml-3 text-gray-600">Procesando archivo...</span>
                        </div>
                    </div>
                `;
                return;
            }

            if (state.error) {
                app.innerHTML = `
                    <div class="p-8 max-w-4xl mx-auto">
                        <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                            <p class="text-red-800 font-semibold">Error:</p>
                            <p class="text-red-600 mt-2">${state.error}</p>
                        </div>
                        <button onclick="resetApp()" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                            Intentar de nuevo
                        </button>
                    </div>
                `;
                return;
            }

            if (!state.fileSelected) {
                app.innerHTML = `
                    <div class="p-8 max-w-2xl mx-auto">
                        <div class="text-center">
                            <h1 class="text-3xl font-bold mb-4 text-gray-800">
                                Análisis de Precios del Dólar
                            </h1>
                            <p class="text-gray-600 mb-6">
                                Selecciona tu archivo Excel para analizar días con precios altos
                            </p>
                            <div class="border-2 border-dashed border-gray-300 rounded-lg p-12 bg-gray-50 hover:bg-gray-100 transition-colors">
                                <input
                                    type="file"
                                    accept=".xls,.xlsx"
                                    onchange="handleFileUpload(event)"
                                    class="hidden"
                                    id="fileInput"
                                />
                                <label for="fileInput" class="cursor-pointer flex flex-col items-center">
                                    <svg class="w-16 h-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                                    </svg>
                                    <span class="text-lg font-semibold text-gray-700">
                                        Seleccionar archivo Excel
                                    </span>
                                    <span class="text-sm text-gray-500 mt-2">
                                        .xls o .xlsx
                                    </span>
                                </label>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // Mostrar resultados
            const d = state.data;
            let html = `
                <div class="p-8 max-w-6xl mx-auto">
                    <h1 class="text-3xl font-bold mb-2 text-gray-800">
                        Análisis de Precios del Dólar
                    </h1>
                    <p class="text-gray-600 mb-8">
                        ${d.totalRecords} registros analizados
                    </p>

                    <div class="mb-10">
                        <h2 class="text-2xl font-bold mb-4 text-gray-800">
                            Top 3 Precios Más Altos y Frecuencia
                        </h2>
                        <div class="space-y-4">
            `;

            d.topPriceGroups.forEach((item, index) => {
                html += `
                    <div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-lg p-6 border border-blue-200 shadow-sm">
                        <div class="flex items-start justify-between">
                            <div class="flex items-center gap-4">
                                <div class="bg-indigo-600 text-white rounded-full w-12 h-12 flex items-center justify-center text-xl font-bold">
                                    ${index + 1}
                                </div>
                                <div>
                                    <div class="text-sm font-semibold text-gray-500 mb-1">Precio</div>
                                    <div class="text-3xl font-bold text-gray-800">$${item.price.toFixed(4)} MXN</div>
                                    <div class="mt-3">
                                        <div class="text-sm font-semibold text-gray-600 mb-2">
                                            Días con este precio (${item.count} ${item.count === 1 ? 'vez' : 'veces'}):
                                        </div>
                                        <div class="flex flex-wrap gap-2">
                                            ${item.dates.slice(0, 10).map(date => 
                                                `<span class="bg-white px-3 py-1 rounded-full text-sm text-gray-700 border border-gray-300">${date}</span>`
                                            ).join('')}
                                            ${item.dates.length > 10 ? `<span class="px-3 py-1 text-sm text-gray-500">+${item.dates.length - 10} más</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm text-gray-600 mb-1">Frecuencia</div>
                                <div class="text-4xl font-bold text-indigo-600">${item.count}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                        </div>
                    </div>

                    <div class="mb-10">
                        <h2 class="text-2xl font-bold mb-4 text-gray-800">
                            Días con Mayor Incidencia de Precios Altos
                        </h2>
                        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
                            <table class="w-full">
                                <thead class="bg-gray-50 border-b border-gray-200">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">#</th>
                                        <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Fecha</th>
                                        <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Día</th>
                                        <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">Precio Máximo</th>
                                        <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">Registros</th>
                                    </tr>
                                </thead>
                                <tbody>
            `;

            d.topDays.forEach((day, index) => {
                html += `
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="px-6 py-4 text-gray-600">${index + 1}</td>
                        <td class="px-6 py-4 font-medium text-gray-800">${day.date}</td>
                        <td class="px-6 py-4">
                            <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium">
                                ${day.dayOfWeek}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right font-bold text-green-600">$${day.maxPrice.toFixed(4)}</td>
                        <td class="px-6 py-4 text-right text-gray-600">${day.count}</td>
                    </tr>
                `;
            });

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-2xl font-bold mb-4 text-gray-800">
                            Días de la Semana con Más Precios Altos
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            `;

            d.weekdayStats.forEach((day, index) => {
                html += `
                    <div class="bg-gradient-to-br from-purple-50 to-pink-50 rounded-lg p-6 border border-purple-200 shadow-sm">
                        <div class="flex items-center justify-between mb-3">
                            <div class="bg-purple-600 text-white rounded-full w-10 h-10 flex items-center justify-center text-lg font-bold">
                                ${index + 1}
                            </div>
                            <div class="text-3xl font-bold text-purple-600">${day.count}</div>
                        </div>
                        <div class="text-xl font-bold text-gray-800 mb-2">${day.dayName}</div>
                        <div class="text-sm text-gray-600">Promedio precio máximo:</div>
                        <div class="text-lg font-semibold text-gray-700">$${day.avgMaxPrice.toFixed(4)}</div>
                        <div class="mt-2 text-xs text-gray-500">
                            ${day.count} ${day.count === 1 ? 'día' : 'días'} con precios altos
                        </div>
                    </div>
                `;
            });

            html += `
                        </div>
                    </div>

                    <button onclick="resetApp()" class="mt-8 px-6 py-2 bg-gray-600 text-white rounded hover:bg-gray-700 transition-colors">
                        Cargar otro archivo
                    </button>
                </div>
            `;

            app.innerHTML = html;
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            state.loading = true;
            state.error = null;
            state.fileSelected = true;
            render();

            try {
                const arrayBuffer = await file.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                const headers = jsonData[0];
                const rows = jsonData.slice(1);
                
                let dateIndex = -1;
                let priceIndex = -1;
                
                if (headers) {
                    dateIndex = headers.findIndex(h => 
                        h && (h.toString().toLowerCase().includes('fecha') ||
                        h.toString().toLowerCase().includes('date') ||
                        h.toString().toLowerCase().includes('dia'))
                    );
                    
                    priceIndex = headers.findIndex(h => 
                        h && (h.toString().toLowerCase().includes('precio') ||
                        h.toString().toLowerCase().includes('price') ||
                        h.toString().toLowerCase().includes('tipo') ||
                        h.toString().toLowerCase().includes('cambio'))
                    );
                }
                
                if (dateIndex === -1) dateIndex = 0;
                if (priceIndex === -1) priceIndex = 1;
                
                const priceData = [];
                const dayCount = {};
                
                rows.forEach((row, idx) => {
                    if (row && row[priceIndex] !== undefined && row[priceIndex] !== null && row[priceIndex] !== '') {
                        const price = parseFloat(row[priceIndex]);
                        let dateStr = row[dateIndex];
                        
                        if (typeof dateStr === 'number') {
                            const date = XLSX.SSF.parse_date_code(dateStr);
                            dateStr = `${date.d}/${date.m}/${date.y}`;
                        } else if (dateStr instanceof Date) {
                            dateStr = dateStr.toLocaleDateString('es-MX');
                        } else {
                            dateStr = dateStr ? dateStr.toString() : `Registro ${idx + 1}`;
                        }
                        
                        if (!isNaN(price) && price > 0) {
                            priceData.push({
                                date: dateStr,
                                price: price,
                                row: idx + 2
                            });
                            
                            if (dayCount[dateStr]) {
                                dayCount[dateStr].count++;
                                dayCount[dateStr].prices.push(price);
                            } else {
                                dayCount[dateStr] = {
                                    date: dateStr,
                                    count: 1,
                                    prices: [price]
                                };
                            }
                        }
                    }
                });
                
                const priceGroups = {};
                priceData.forEach(item => {
                    const priceKey = item.price.toFixed(4);
                    if (!priceGroups[priceKey]) {
                        priceGroups[priceKey] = {
                            price: item.price,
                            dates: [],
                            count: 0
                        };
                    }
                    priceGroups[priceKey].dates.push(item.date);
                    priceGroups[priceKey].count++;
                });
                
                const topPriceGroups = Object.values(priceGroups)
                    .sort((a, b) => b.price - a.price)
                    .slice(0, 3);
                
                const dayStats = Object.values(dayCount).map(day => {
                    let dayOfWeek = 'N/A';
                    let dateObj = null;
                    
                    try {
                        const dateStr = day.date;
                        
                        if (dateStr.includes('/')) {
                            const parts = dateStr.split('/');
                            if (parts.length === 3) {
                                const d = parseInt(parts[0]);
                                const m = parseInt(parts[1]) - 1;
                                const y = parseInt(parts[2]);
                                dateObj = new Date(y, m, d);
                            }
                        } else if (dateStr.includes('-')) {
                            dateObj = new Date(dateStr);
                        }
                        
                        if (dateObj && !isNaN(dateObj.getTime())) {
                            const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
                            dayOfWeek = days[dateObj.getDay()];
                        }
                    } catch (e) {}
                    
                    return {
                        date: day.date,
                        dayOfWeek: dayOfWeek,
                        count: day.count,
                        avgPrice: day.prices.reduce((a, b) => a + b, 0) / day.prices.length,
                        maxPrice: Math.max(...day.prices),
                        minPrice: Math.min(...day.prices)
                    };
                }).sort((a, b) => b.maxPrice - a.maxPrice);
                
                const topDays = dayStats.slice(0, 10);
                
                const weekdayCount = {};
                dayStats.forEach(day => {
                    if (day.dayOfWeek !== 'N/A') {
                        if (!weekdayCount[day.dayOfWeek]) {
                            weekdayCount[day.dayOfWeek] = {
                                dayName: day.dayOfWeek,
                                count: 0,
                                totalMaxPrice: 0,
                                avgMaxPrice: 0
                            };
                        }
                        weekdayCount[day.dayOfWeek].count++;
                        weekdayCount[day.dayOfWeek].totalMaxPrice += day.maxPrice;
                    }
                });
                
                const weekdayStats = Object.values(weekdayCount).map(day => ({
                    ...day,
                    avgMaxPrice: day.totalMaxPrice / day.count
                })).sort((a, b) => b.count - a.count);
                
                state.data = {
                    headers,
                    totalRecords: rows.length,
                    topPriceGroups,
                    topDays,
                    weekdayStats,
                    allPrices: priceData.length
                };
                state.loading = false;
                render();
            } catch (err) {
                state.error = err.message;
                state.loading = false;
                render();
            }
        }

        function resetApp() {
            state.data = null;
            state.error = null;
            state.fileSelected = false;
            render();
        }

        render();
    </script>
</body>
</html>
